name: Validar estrutura do plugin

# A main é a base que o Bubble importa. Se ela quebrar, o sync quebra —
# então toda alteração que chega nela passa por aqui antes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tools/validate-plugin.js
